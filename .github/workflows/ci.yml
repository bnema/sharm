name: CI

on:
  push:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'
      - 'Makefile'
      - '.github/workflows/**'
      - '!**.md'
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'
      - 'Makefile'
      - '.github/workflows/**'
      - '!**.md'

jobs:
  ci:
    permissions:
      contents: read
      pull-requests: read
    uses: bnema/gh-actions/.github/workflows/go-ci.yml@main
    with:
      go-version: '1.26.2'
      lint-command: |
        set -eu
        go install github.com/golangci/golangci-lint/cmd/golangci-lint@v2.12.2

        if [ "${{ github.event_name }}" = "pull_request" ]; then
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          base_rev="refs/remotes/origin/${{ github.base_ref }}"
        else
          git fetch --no-tags --depth=2 origin "${{ github.ref_name }}:refs/remotes/origin/${{ github.ref_name }}"
          base_rev="${{ github.event.before }}"
        fi

        if [ -z "$base_rev" ] || [ "$base_rev" = "0000000000000000000000000000000000000000" ]; then
          golangci-lint run --timeout=5m
          exit 0
        fi

        golangci-lint run --new-from-rev="$base_rev" --timeout=5m
      test-flags: '-race -v ./...'
