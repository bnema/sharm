name: Release Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing semver tag to publish (for example v1.9.0 or v1.10.0-rc.1)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  release-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release metadata
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -eu

          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Expected a semver tag like v1.9.0 or v1.10.0-rc.1, got: $tag" >&2
            exit 1
          fi

          git fetch --force origin +refs/heads/main:refs/remotes/origin/main --tags
          git switch --detach "refs/tags/$tag"

          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          commit="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$commit" refs/remotes/origin/main; then
            echo "Refusing to publish tag $tag because $commit is not reachable from origin/main" >&2
            exit 1
          fi

          stable_tag=false
          latest_stable_tag=''
          case "$tag" in
            *-*) ;;
            *)
              stable_tag=true
              latest_stable_tag="$(git tag --merged refs/remotes/origin/main --list 'v*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
              ;;
          esac

          publish_latest=false
          if [ "$stable_tag" = true ] && [ "$tag" = "$latest_stable_tag" ]; then
            publish_latest=true
          fi

          tags="${image}:${tag}"
          if [ "$publish_latest" = true ]; then
            tags="${tags},${image}:latest"
          fi

          {
            echo "tag=$tag"
            echo "image=$image"
            echo "commit=$commit"
            echo "tags=$tags"
            echo "publish_latest=$publish_latest"
            echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release.outputs.tags }}
          build-args: |
            VERSION=${{ steps.release.outputs.tag }}
            COMMIT=${{ steps.release.outputs.commit }}
            BUILD_TIME=${{ steps.release.outputs.build_time }}
          labels: |
            org.opencontainers.image.title=sharm
            org.opencontainers.image.description=Self-hosted ephemeral media sharing with auto-transcoding and rich embeds.
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release.outputs.commit }}
            org.opencontainers.image.version=${{ steps.release.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
